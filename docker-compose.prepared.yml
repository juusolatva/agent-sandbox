# Use through sandbox.py run, which supplies an immutable prepared image ID.
services:
  sandbox:
    image: ${PREPARED_IMAGE:?Set PREPARED_IMAGE to a checked project image ID}
    build: !reset null
    volumes: !override
      - ./agent.py:/opt/sandbox/agent.py:ro
    mem_limit: ${PROJECT_MEMORY:-4g}
    pids_limit: 256
    # The project is baked into the image's workspace, so it must stay writable.
    # Edits are discarded when the container is removed (see STAGE2.md).
    read_only: false
