# Legacy Compose override for a prepared project image. Set PREPARED_IMAGE to the
# immutable image ID from a sandbox.py prepare state file. (sandbox.py run does not
# use Compose; it starts its own workers.)
services:
  sandbox:
    image: ${PREPARED_IMAGE:?Set PREPARED_IMAGE to a checked project image ID}
    build: !reset null
    volumes: !override
      - ./agent.py:/opt/sandbox/agent.py:ro
    mem_limit: ${PROJECT_MEMORY:-4g}
    pids_limit: 256
    # The project is baked into the image's workspace, so it must stay writable.
    # Edits are discarded when the container is removed (see README.md).
    read_only: false
