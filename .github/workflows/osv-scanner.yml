name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '40 15 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-scheduled:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # SARIF upload needs GitHub code scanning enabled for this repository. Set the
      # OSV_UPLOAD_SARIF repository variable to 'true' once it is; until then results
      # stay in the job log and vulnerabilities still fail the run.
      upload-sarif: ${{ vars.OSV_UPLOAD_SARIF == 'true' }}
      # requirements-controller.txt is the hashed host controller lock, transitive
      # dependencies included, so --no-resolve still scans every installed package;
      # -r also finds fixture manifests and any lockfiles added later.
      scan-args: |-
        --lockfile=requirements.txt:requirements-controller.txt
        --no-resolve
        -r
        ./

  scan-pr:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: ${{ vars.OSV_UPLOAD_SARIF == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      scan-args: |-
        --lockfile=requirements.txt:requirements-controller.txt
        --no-resolve
        -r
        ./
