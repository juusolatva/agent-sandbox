name: Offline language smoke checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [cpp, go, rust, python313, python314, node]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python sandbox.py build ${{ matrix.profile }}
      - run: python sandbox.py prepare examples/${{ matrix.profile }}.json --state artifacts/${{ matrix.profile }}.json
      - run: python sandbox.py check artifacts/${{ matrix.profile }}.json
      - if: matrix.profile == 'python313'
        run: SANDBOX_DOCKER_TESTS=1 SANDBOX_TEST_PROFILE=python313 python -m unittest discover -s tests -p test_execution_integration.py -v
      - if: matrix.profile == 'cpp'
        run: SANDBOX_DOCKER_TESTS=1 SANDBOX_TEST_PROFILE=cpp python -m unittest discover -s tests -p test_execution_integration.py -k CppSanitizerRegression -v
