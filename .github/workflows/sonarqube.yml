name: SonarQube
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  analysis:
    name: SonarQube Cloud analysis
    runs-on: [self-hosted, vakoilu]
    timeout-minutes: 30
    env:
      # Only a presence flag: the token itself is never exposed to build or test steps.
      # It is absent for pull requests from forks, so analysis is skipped instead of failing.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history for blame data and new-code detection.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: 'python -m pip install --only-binary :all: coverage==7.16.2'
      # The Docker boundary tests cover execution and controller paths that unit tests cannot.
      - run: python sandbox.py build python313
      - run: python sandbox.py prepare examples/python313.json --state artifacts/python313.json
      - name: Run tests with coverage
        env:
          SANDBOX_DOCKER_TESTS: '1'
          SANDBOX_TEST_PROFILE: python313
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage xml
          python -m coverage report --skip-empty
      - name: SonarQube scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
