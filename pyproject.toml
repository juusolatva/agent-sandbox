[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Offline, sandboxed local-LLM investigation harness"
requires-python = ">=3.13"

[tool.coverage.run]
# Relative paths let SonarQube map the report onto the checkout.
relative_files = true
branch = true
source = ["."]
omit = ["tests/*", "examples/*", "artifacts/*"]

[tool.coverage.xml]
output = "coverage.xml"
