services:
  # Bridge proxy: forwards traffic from the offline sandbox network to the host inference server
  llm-proxy:
    # Pinned to a release and digest; update both together after reviewing the new image.
    image: alpine/socat:1.8.1.1@sha256:7f9a06753033f2b7de18edc2353f2c15153413d95a039163c6db270fc7a6c3b0
    restart: unless-stopped
    command: >
      TCP-LISTEN:1234,fork,reuseaddr
      TCP:${LLM_HOST:-${LM_STUDIO_HOST:?Set LLM_HOST in .env (see .env.example)}}:${LLM_PORT:-${LM_STUDIO_PORT:-1234}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sandbox_net
      - host_bridge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  # Isolated LLM Sandbox: NO internet access, can only reach llm-proxy:1234
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - llm-proxy
    environment:
      - OPENAI_BASE_URL=http://llm-proxy:1234/v1
      # Fixed dummy key: this container runs model-chosen commands, so never forward
      # real credentials into it. Use the host controller for authenticated servers.
      - OPENAI_API_KEY=local
      - LLM_MODEL=${LLM_MODEL:-}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-20}
      - MAX_HISTORY_MESSAGES=${MAX_HISTORY_MESSAGES:-24}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-12000}
      - MAX_SUMMARY_CHARS=${MAX_SUMMARY_CHARS:-3000}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-30}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
      - VERIFY_CMD=${VERIFY_CMD:-}
      - CONTINUOUS=${CONTINUOUS:-0}
    volumes:
      # Read-only mount for the agent loop script so the LLM cannot overwrite its own harness
      - ./agent.py:/opt/sandbox/agent.py:ro
      # Shared workspace where the LLM can create, modify, and execute files
      - ./workspace:/home/agent/workspace
    networks:
      - sandbox_net
    # Sandbox hardening & resource limits
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; only /tmp and the mounted workspace are writable
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    init: true
    stdin_open: true
    tty: true

networks:
  # Strictly offline network: containers ONLY on this network have no external routing
  sandbox_net:
    driver: bridge
    internal: true
  # Standard bridge used exclusively by llm-proxy to reach the host
  host_bridge:
    driver: bridge
