sonar.organization=juusolatva
sonar.projectKey=juusolatva_agent-sandbox
sonar.projectName=agent-sandbox

# Harness sources; tests are indexed separately, never as main code.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,artifacts/**,workspace/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
# Example projects and verifier fixtures are analyzed but are not harness code.
sonar.coverage.exclusions=examples/**
